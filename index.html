<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071323" />
    <meta name="description" content="格致中學 2026 聖誕活動・點亮屬於我們的冬夜。" />
    <title>GJ Christmas 2026 · 冬夜邀請</title>
  </head>
  <body>
    <main>
      <header class="masthead"><a href="./" aria-label="GJ Christmas 首頁">GJ<span>CHRISTMAS</span></a><span class="edition">THE WINTER GATHERING · 2026</span></header>
      <button id="fullscreen" class="fullscreen-button" type="button" aria-label="進入全螢幕" aria-pressed="false" hidden><span class="fullscreen-icon" aria-hidden="true">⛶</span><span class="fullscreen-label">全螢幕</span></button>
      <section class="invitation" aria-labelledby="title">
        <p class="eyebrow">格致中學 · 聖誕之夜</p>
        <h1 id="title">讓一束光，<br />喚醒整個<span>冬夜。</span></h1>
        <p class="intro">星光正等待你的指尖。<br />一起點亮今年的聖誕記憶。</p>
        <div class="event"><span class="date">12.18</span><div>FRIDAY, 2026<br /><span>格致中學 · CHRISTMAS CELEBRATION</span></div></div>
        <button id="awaken" type="button"><span class="button-star" aria-hidden="true">✧</span><span id="button-label">喚醒聖誕樹</span><span aria-hidden="true">↗</span></button>
        <p id="status" class="status" role="status" aria-live="polite">一場冬夜的魔法，由你開始</p>
      </section>
      <div id="scene" aria-label="可旋轉的立體聖誕樹"><canvas id="tree-canvas" tabindex="0" aria-label="聖誕樹，拖曳旋轉；手機雙指旋轉縮放，電腦可同時拖曳與滾輪縮放"></canvas><p class="gesture"><span>↔</span> 拖曳＋滾輪 · 雙指旋轉縮放</p></div>
      <div id="reveal" class="reveal" aria-hidden="true">Light Up <em>Christmas 2026</em></div>
      <footer><span>A LITTLE LIGHT. A LITTLE WONDER.</span><span>GJ CHRISTMAS 2026 <i>✦</i></span></footer>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
