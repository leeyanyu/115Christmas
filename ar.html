<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071323" />
    <meta name="description" content="把格致聖誕樹放進後鏡頭畫面，和孩子留下聖誕合照。" />
    <title>聖誕樹實景合照 · GJ Christmas</title>
  </head>
  <body>
    <header class="ar-header"><a href="./" aria-label="回到格致聖誕網站">GJ <span>CHRISTMAS</span></a><a class="back-link" href="./">回到冬夜 ↗</a></header>
    <main class="ar-layout">
      <section class="ar-intro" aria-labelledby="ar-title">
        <p class="eyebrow">A TREE, ANYWHERE</p>
        <h1 id="ar-title">把聖誕樹，<br />帶到你們身邊。</h1>
        <p class="intro">選一個喜歡的角落，讓孩子站在樹旁，<br />留下一張屬於你們的聖誕合照。</p>
      </section>
      <section class="preview-card" aria-label="聖誕樹作品預覽">
        <canvas id="ar-preview" tabindex="0" aria-label="聖誕樹立體預覽，可拖曳轉向或雙指縮放"></canvas>
        <p id="preview-status" class="preview-status" role="status">正在準備聖誕樹…</p>
        <p class="preview-hint" id="preview-hint" hidden>拖曳轉向 · 雙指縮放</p>
      </section>
      <section class="ar-actions" aria-label="放置聖誕樹與合照">
        <p class="work-credit"><span id="work-title">格致聖誕樹</span><span id="work-author">格致中學</span></p>
        <p id="work-blessing" class="blessing"></p>
        <button id="ar-launch" class="ar-launch" type="button" hidden><img src="./ar-mark.svg" width="25" height="25" alt="" />開啟後鏡頭合照</button>
        <p id="ar-support" class="support" role="status"></p>
        <ol id="ar-steps" class="ar-steps" hidden>
          <li>允許鏡頭，讓孩子站在畫面裡。</li>
          <li>拖曳放置聖誕樹，雙指或滑桿調整大小。</li>
          <li>按下拍照，把合照儲存或分享出去。</li>
        </ol>
        <button id="share-tree" class="share-button" type="button">分享這棵聖誕樹 ↗</button>
        <p id="share-note" class="support" role="status" aria-live="polite"></p>
        <label id="share-link-label" class="support" for="share-link" hidden>複製連結，在手機開啟</label>
        <input id="share-link" class="share-link" type="url" readonly hidden aria-label="這棵聖誕樹的合照連結" />
        <a id="default-tree" class="back-link" href="./ar.html?tree=gj-2026" hidden>看看格致聖誕樹 ↗</a>
      </section>
    </main>
    <dialog id="photo-studio" class="photo-studio" aria-labelledby="photo-title">
      <header class="photo-header"><h2 id="photo-title">聖誕合照</h2><button id="photo-close" type="button" aria-label="關閉合照並停止鏡頭">×</button></header>
      <div id="photo-frame" class="photo-frame">
        <video id="photo-video" autoplay muted playsinline aria-label="後鏡頭畫面"></video>
        <canvas id="photo-tree" tabindex="0" aria-label="拖曳放置聖誕樹，雙指縮放" hidden></canvas>
        <img id="photo-result" alt="你與聖誕樹的合照" hidden />
        <p id="photo-hint" class="photo-hint" hidden>拖曳放置 · 雙指縮放</p>
      </div>
      <div class="photo-controls">
        <div id="photo-live-actions" hidden>
          <div class="photo-scale"><button id="photo-smaller" type="button" aria-label="縮小聖誕樹">−</button><input id="photo-scale" type="range" min="14" max="88" value="50" aria-label="聖誕樹大小" /><button id="photo-larger" type="button" aria-label="放大聖誕樹">＋</button></div>
          <button id="photo-shoot" class="photo-shoot" type="button" aria-label="拍下聖誕合照" disabled><span></span></button>
        </div>
        <div id="photo-review-actions" class="photo-review-actions" hidden><button id="photo-retake" type="button">重拍</button><a id="photo-save" download>儲存照片</a><button id="photo-share" type="button" hidden>分享照片</button></div>
        <button id="photo-retry" class="photo-retry" type="button" hidden>重新開啟鏡頭</button>
        <p id="photo-status" class="photo-status" role="status" aria-live="polite"></p>
      </div>
    </dialog>
    <footer>GJ CHRISTMAS 2026 · A LITTLE LIGHT, WHEREVER YOU ARE.</footer>
    <script type="module" src="/src/ar/main.js"></script>
  </body>
</html>
